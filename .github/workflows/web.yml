name: Web

# Web（JS/Wasm）构建、按版本发布到 `app/`、并更新入口页。
#
# ## 目录约定（见 tool/web_publish.py）
#   app/index.html     入口页：iframe 包裹**当前版本**，地址长期不变
#   app/versions.json  已发布版本清单（新版本在前）
#   app/v650/          某版本的完整产物（由本工作流生成并提交）
#
# ## 与五平台发布的关系
# 互不影响：本工作流的成败**不阻塞** build.yml 的五平台发布（两者无 needs 关系）。
# 自 7.0 起 Web 是正式平台之一，因此在 main 与 web 两条分支上都会构建。
#
# ## 当前状态
# 这个分支的 lib/ 正在做 Web 适配（`dart:io` 在浏览器里不存在）。适配完成前
# 本工作流会失败 —— 那不是配置问题，就是待办本身。

on:
  push:
    branches: [web, main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  build-web:
    name: 构建并发布 Web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 取依赖
        run: flutter pub get

      # 平台目录不提交，由 CI 现场生成。web/ 已在仓库里（PWA 脚手架 + 图标），
      # `flutter create` 只补齐缺失项，不覆盖已有文件。
      - name: 生成平台目录
        run: flutter create --platforms=web --org com.yingo --project-name ohgithublost .

      - name: 构建（release）
        run: flutter build web --release

      - name: 读出版本号
        id: ver
        run: |
          set -eu
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - name: 按版本发布到 app/
        run: python3 tool/web_publish.py build/web "${{ steps.ver.outputs.version }}"

      - name: 上传产物（便于排查）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ogl-web
          path: build/web
          if-no-files-found: warn
          retention-days: 14

      # 提交回分支：app/ 下的版本目录与入口页需要长期可访问。
      # 提交信息带 [skip ci]，避免本工作流自己触发自己。
      - name: 提交 app/
        run: |
          set -eu
          git config user.name  'ogl-web-bot'
          git config user.email 'ogl-web-bot@users.noreply.github.com'
          git add -A app
          if git diff --cached --quiet; then
            echo 'app/ 无变化，跳过提交'
            exit 0
          fi
          git commit -m "chore(web): 发布 ${{ steps.ver.outputs.version }} 到 app/ [skip ci]"
          git push
