name: CI

# 质量门：静态分析 + 单元测试
# 任何 push / PR / 手动触发都会执行；CI 未通过禁止合入（见 docs/STANDARDS.md S6）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 质量门（analyze + test）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 环境信息
        run: flutter --version

      - name: 获取依赖
        run: flutter pub get

      - name: 静态分析（警告即失败）
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 单元测试（含渲染快照）
        run: flutter test --reporter expanded

      # 渲染快照产物：把主壳在 N 套主题 × N 种屏幕形态下真实渲染成 PNG 上传。
      # 这样"界面到底长什么样"第一次变成可看、可比、可回溯的事实。
      - name: 上传 UI 渲染快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: build/ui_shots/*.png
          if-no-files-found: warn
          retention-days: 14